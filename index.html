              '</div>' +
              '<div class="grid-2 divider-top" style="font-size:13px;">' +
                '<div><h4 style="margin:0 0 6px;color:var(--navy-900);">입력 정보에 근거한 확실한 사실</h4><ul style="margin:0;padding-left:18px;color:#4B5568;">' +
                  simOpt.futureSimulation.confirmedFacts.map(function (x) { return '<li style="margin-bottom:4px;">' + escapeHtml(x) + '</li>'; }).join('') +
                '</ul></div>' +
                '<div><h4 style="margin:0 0 6px;color:var(--navy-700);">분석 가정 및 추론 영역</h4><ul style="margin:0;padding-left:18px;color:#4B5568;">' +
                  simOpt.futureSimulation.aiAssumptions.map(function (x) { return '<li style="margin-bottom:4px;">' + escapeHtml(x) + '</li>'; }).join('') +
                '</ul></div>' +
              '</div>' +
            '</div>' +
          '</section>' +

          '<!-- 7. 후회 방지 체크 -->' +
          '<section aria-labelledby="sec-regret-check" class="stack-sm">' +
            '<div>' +
              '<div class="flex-row" style="gap:6px;font-size:14px;font-weight:600;color:var(--navy-700);">' + ICONS.shield + '<span>최종 확정 전 셀프 점검</span></div>' +
              '<h2 id="sec-regret-check" class="h2-section" style="margin-top:4px;">7. 후회 방지 체크</h2>' +
              '<p class="muted" style="margin-top:4px;">현재 염두에 둔 선택지(<strong style="color:var(--navy-900);">' + escapeHtml(candidateOpt.optionName) + '</strong>)를 기준으로 아래 질문에 답해 보세요. 답변을 바탕으로 놓치기 쉬운 점검 포인트를 짚어드립니다.</p>' +
            '</div>' +
            '<form id="regret-check-form" class="card stack-sm">' +
              '<div class="grid-2">' + regretQHtml + '</div>' +
              (state.regretError ? '<p role="alert" class="error-text">' + escapeHtml(state.regretError) + '</p>' : '') +
              '<div style="display:flex;justify-content:flex-end;">' +
                '<button type="submit" class="btn btn-lavender">' + ICONS.sparkles + '<span>후회 방지 점검 받기</span></button>' +
              '</div>' +
            '</form>' +
            regretFeedbackHtml +
          '</section>' +

          '<!-- 8. 최종 선택 버튼 -->' +
          '<section aria-labelledby="sec-final-action" class="card stack-sm">' +
            '<div>' +
              '<h2 id="sec-final-action" class="h2-section">8. 최종 선택 확정 및 기록하기</h2>' +
              '<p class="muted" style="margin-top:4px;">분석 내용을 참고하여 직접 최종 선택지를 고르고, 결정 기록으로 남겨보세요.</p>' +
            '</div>' +
            '<div class="flex-row">' + choiceBtns + '</div>' +
            confirmBanner +
            '<div class="divider-top flex-row">' +
              '<button type="button" class="btn btn-primary" data-action="confirm-decision">' + ICONS.check + '<span>이 선택으로 결정하기</span></button>' +
              '<button type="button" class="btn btn-lavender" data-action="save-record">' + ICONS.bookmark + '<span>' + (state.currentRecordId ? '선택 기록 업데이트하기' : '선택 기록 저장하기') + '</span></button>' +
              '<button type="button" class="btn btn-secondary" data-action="reanalyze">' + ICONS.reset + '<span>다시 분석하기</span></button>' +
              '<button type="button" class="btn btn-secondary" style="background:var(--ivory-50);" data-nav="home">' + ICONS.home + '<span>홈으로 돌아가기</span></button>' +
            '</div>' +
          '</section>' +
        '</div>';
      }

      function renderHistoryView() {
        var q = state.historySearch.trim().toLowerCase();
        var filtered = state.records.filter(function (rec) {
          if (!q) return true;
          return rec.title.toLowerCase().indexOf(q) !== -1 ||
            rec.finalDecision.toLowerCase().indexOf(q) !== -1 ||
            rec.recommendedOption.toLowerCase().indexOf(q) !== -1 ||
            (rec.review || '').toLowerCase().indexOf(q) !== -1;
        });

        var searchHtml = state.records.length > 0
          ? '<div style="position:relative;">' +
              '<span style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#6B7280;display:flex;">' + ICONS.search + '</span>' +
              '<input id="history-search-input" type="search" class="input" style="padding-left:40px;background:#FFFFFF;" value="' + escapeHtml(state.historySearch) + '" aria-label="결정 기록 검색" placeholder="고민 제목, 최종 선택, 후기 내용으로 검색..." />' +
            '</div>'
          : '';

        var bodyHtml = '';
        if (state.records.length === 0) {
          bodyHtml = '<div class="card stack-sm" style="text-align:center;padding:48px 24px;">' +
            '<div class="feature-icon-box" style="margin:0 auto;">' + ICONS.book + '</div>' +
            '<h2 class="h3-card">아직 저장된 결정 기록이 없습니다</h2>' +
            '<p class="muted" style="max-width:420px;margin:0 auto;line-height:1.6;">새로운 고민을 분석한 뒤 ‘선택 기록 저장하기’를 누르면 이곳에 자동으로 보관되며, 언제든지 만족도와 후기를 남길 수 있습니다.</p>' +
            '<div class="flex-row" style="justify-content:center;padding-top:8px;">' +
              '<button type="button" class="btn btn-primary" data-action="start-new">새로운 고민 시작하기</button>' +
              '<button type="button" class="btn btn-lavender" data-action="seed-sample-record">예시 기록 1건 추가해 보기</button>' +
            '</div>' +
          '</div>';
        } else if (filtered.length === 0) {
          bodyHtml = '<div class="card" style="text-align:center;padding:40px;"><p style="margin:0;font-weight:700;">검색 결과가 없습니다</p><p class="muted" style="margin-top:6px;">다른 검색어로 다시 찾아보세요.</p></div>';
        } else {
          bodyHtml = '<div class="stack-sm">' + filtered.map(function (rec) {
            var isEditing = state.editingRecordId === rec.id;
            var isConfirmDel = state.confirmDeleteId === rec.id;

            var actionControls = '';
            if (!isEditing) {
              actionControls = '<div class="flex-row" style="gap:8px;">' +
                '<button type="button" class="btn btn-lavender btn-sm" data-edit-record="' + escapeHtml(rec.id) + '" aria-label="‘' + escapeHtml(rec.title) + '’ 기록 수정">' + ICONS.edit + '<span>복기 수정</span></button>' +
                (!isConfirmDel
                  ? '<button type="button" class="btn btn-secondary btn-sm" style="color:#6B7280;" data-ask-delete="' + escapeHtml(rec.id) + '" aria-label="‘' + escapeHtml(rec.title) + '’ 기록 삭제">' + ICONS.trash + '<span>삭제</span></button>'
                  : '<button type="button" class="btn btn-danger-solid" data-confirm-delete="' + escapeHtml(rec.id) + '">삭제 확인</button>' +
                    '<button type="button" class="btn btn-secondary btn-sm" data-cancel-delete="1">취소</button>') +
              '</div>';
            }

            var starsHtml = '';
            if (rec.satisfaction !== null) {
              starsHtml = '<div class="flex-row" style="gap:4px;">' +
                [1, 2, 3, 4, 5].map(function (s) { return s <= rec.satisfaction ? ICONS.starFilled : ICONS.starEmpty; }).join('') +
                '<span class="mono" style="margin-left:6px;font-weight:600;">' + rec.satisfaction + ' / 5점</span>' +
              '</div>';
            } else {
              starsHtml = '<p class="muted" style="font-size:12px;">아직 만족도를 기록하지 않았습니다. ‘복기 수정’에서 점수를 남겨보세요.</p>';
            }

            var rightCol = !isEditing
              ? '<div class="sim-block-ivory stack-xs">' +
                  '<div><span style="font-size:12px;font-weight:600;color:var(--text-muted);display:block;">나의 최종 결정</span><strong style="font-size:16px;color:var(--navy-900);">' + escapeHtml(rec.finalDecision) + '</strong></div>' +
                  '<div><span style="font-size:12px;font-weight:600;color:var(--text-muted);display:block;margin-bottom:4px;">실제 만족도</span>' + starsHtml + '</div>' +
                  '<div><span style="font-size:12px;font-weight:600;color:var(--text-muted);display:block;">간단한 후기</span><p style="margin:4px 0 0;font-size:14px;color:var(--text-secondary);">' + escapeHtml(rec.review && rec.review.trim() ? rec.review : '아직 작성된 후기가 없습니다.') + '</p></div>' +
                '</div>'
              : '<form class="sim-block-lavender stack-xs" data-save-edit-form="' + escapeHtml(rec.id) + '">' +
                  '<div>' +
                    '<label class="field-label" style="font-size:12px;" for="edit-decision-' + escapeHtml(rec.id) + '">최종 결정</label>' +
                    '<select id="edit-decision-' + escapeHtml(rec.id) + '" class="select" style="background:#FFFFFF;" data-edit-decision="1">' +
                      rec.options.map(function (o) {
                        return '<option value="' + escapeHtml(o) + '"' + (state.editFinalDecision === o ? ' selected' : '') + '>' + escapeHtml(o) + '</option>';
                      }).join('') +
                    '</select>' +
                  '</div>' +
                  '<div>' +
                    '<span class="field-label" style="font-size:12px;">실제 만족도 (1~5점)</span>' +
                    '<div class="flex-row" style="gap:6px;">' +
                      [1, 2, 3, 4, 5].map(function (s) {
                        var active = state.editSatisfaction === s;
                        return '<button type="button" class="btn btn-sm ' + (active ? 'btn-primary' : 'btn-secondary') + '" data-set-sat="' + s + '" aria-label="만족도 ' + s + '점">' + s + '점</button>';
                      }).join('') +
                    '</div>' +
                  '</div>' +
                  '<div>' +
                    '<label class="field-label" style="font-size:12px;" for="edit-review-' + escapeHtml(rec.id) + '">간단한 후기</label>' +
                    '<textarea id="edit-review-' + escapeHtml(rec.id) + '" rows="3" class="textarea" style="background:#FFFFFF;" data-edit-review="1" placeholder="결정 이후 실제로 어땠는지, 다음에는 무엇을 참고하고 싶은지 기록해 보세요.">' + escapeHtml(state.editReview) + '</textarea>' +
                  '</div>' +
                  '<div class="flex-row" style="justify-content:flex-end;gap:8px;">' +
                    '<button type="button" class="btn btn-secondary btn-sm" data-cancel-edit="1">취소</button>' +
                    '<button type="submit" class="btn btn-primary btn-sm">저장하기</button>' +
                  '</div>' +
                '</form>';

            return '<article class="card stack-sm">' +
              '<div class="flex-between divider-bottom">' +
                '<div>' +
                  '<div class="flex-row" style="font-size:12px;color:var(--text-muted);gap:8px;margin-bottom:4px;">' +
                    '<span>' + escapeHtml(formatKoreanDate(rec.createdAt)) + '</span><span aria-hidden="true">·</span>' +
                    '<span class="tabular-nums">선택지 ' + rec.options.length + '개</span><span aria-hidden="true">·</span>' +
                    '<span>실제 만족도 ' + (rec.satisfaction !== null ? '<strong class="mono" style="color:var(--navy-900);">' + rec.satisfaction + ' / 5점</strong>' : '미기록') + '</span>' +
                  '</div>' +
                  '<h2 class="h3-card">' + escapeHtml(rec.title) + '</h2>' +
                '</div>' +
                actionControls +
              '</div>' +
              '<div class="grid-2" style="font-size:14px;">' +
                '<div class="stack-xs">' +
                  '<div><span style="font-size:12px;font-weight:600;color:var(--text-muted);display:block;">검토했던 선택지</span><p style="margin:2px 0 0;">' + escapeHtml(rec.options.join(' · ')) + '</p></div>' +
                  '<div><span style="font-size:12px;font-weight:600;color:var(--text-muted);display:block;">당시 추천 결과</span><p style="margin:2px 0 0;font-weight:600;color:var(--navy-700);">' + escapeHtml(rec.recommendedOption) + '</p></div>' +
                  '<div><span style="font-size:12px;font-weight:600;color:var(--text-muted);display:block;">당시의 추천 이유</span><p style="margin:2px 0 0;color:var(--text-secondary);line-height:1.6;">' + escapeHtml(rec.recommendationReason) + '</p></div>' +
                '</div>' +
                rightCol +
              '</div>' +
            '</article>';
          }).join('') + '</div>';
        }

        return '<div class="container-results page-section stack-md" style="max-width:1000px;">' +
          '<div class="flex-between">' +
            '<div>' +
              '<h1 class="h1-page">이전 결정 기록 및 복기</h1>' +
              '<p class="muted" style="margin-top:4px;">과거의 고민과 실제 만족도를 돌아보며 나만의 의사결정 기준을 다듬어 보세요.</p>' +
            '</div>' +
            '<button type="button" class="btn btn-primary btn-sm" style="padding:10px 18px;min-height:42px;" data-action="start-new">' + ICONS.plus + '<span>새로운 고민 기록하기</span></button>' +
          '</div>' +
          searchHtml +
          bodyHtml +
        '</div>';
      }

      function render() {
        renderHeader();
        var main = document.getElementById('app-main');
        if (state.view === 'home') {
          main.innerHTML = renderHomeView();
        } else if (state.view === 'input') {
          main.innerHTML = renderInputView();
        } else if (state.view === 'priorities') {
          main.innerHTML = renderPrioritiesView();
        } else if (state.view === 'clarify') {
          main.innerHTML = renderClarifyView();
        } else if (state.view === 'analyzing') {
          main.innerHTML = renderAnalyzingView();
        } else if (state.view === 'results' && state.analysisResult) {
          main.innerHTML = renderResultsView();
        } else {
          main.innerHTML = renderHistoryView();
        }
      }

      /* =========================================================
       * 7. Delegated Event Handling (Smooth, Zero-Flicker)
       * ========================================================= */
      document.addEventListener('click', function (e) {
        var target = e.target.closest('button');
        if (!target) return;

        if (target.dataset.nav) {
          navigate(target.dataset.nav);
          return;
        }
        if (target.dataset.preset) {
          loadPreset(target.dataset.preset);
          return;
        }

        var action = target.dataset.action;
        if (action === 'start-new') { startNew(); return; }
        if (action === 'reset-input') {
          state.dilemma = createEmptyDilemma();
          state.inputErrors = null;
          state.inputSummaryErrors = [];
          render();
          return;
        }
        if (action === 'add-option') {
          if (state.dilemma.options.length < 5) {
            state.dilemma.options.push({
              id: 'opt-' + Date.now() + '-' + (state.dilemma.options.length + 1),
              name: '',
              features: '',
              costOrTime: ''
            });
            render();
          }
          return;
        }
        if (action === 'reset-priorities') {
          state.priorities = clone(DEFAULT_PRIORITIES);
          state.priorityAddError = null;
          render();
          return;
        }
        if (action === 'start-analysis') { startAnalysisFlow(); return; }
        if (action === 'skip-clarify') { runFullAnalysis([]); return; }
        if (action === 'submit-clarify') { runFullAnalysis(state.clarifyingQuestions); return; }
        if (action === 'confirm-decision') {
          var chosen = state.analysisResult.optionsAnalysis.find(function (o) {
            return o.optionId === state.selectedFinalOptionId;
          }) || state.analysisResult.optionsAnalysis[0];
          state.confirmedOptionName = chosen.optionName;
          upsertCurrentRecord(chosen.optionName);
          render();
          return;
        }
        if (action === 'save-record') {
          var cand = state.analysisResult.optionsAnalysis.find(function (o) {
            return o.optionId === state.selectedFinalOptionId;
          }) || state.analysisResult.optionsAnalysis[0];
          upsertCurrentRecord(state.confirmedOptionName || cand.optionName);
          render();
          return;
        }
        if (action === 'reanalyze') { runFullAnalysis(state.clarifyingQuestions); return; }
        if (action === 'seed-sample-record') {
          var now = new Date().toISOString();
          var sample = {
            id: 'sample-' + Date.now(),
            title: '평일 점심 구독 도시락 vs 직접 도시락 싸기',
            createdAt: now,
            updatedAt: now,
            options: ['건강식 정기 구독 도시락', '주 3회 집밥 도시락 준비', '회사 근처 일반 식사'],
            recommendedOption: '건강식 정기 구독 도시락',
            recommendationReason: '시간 절약과 지속 가능성 우선순위가 높은 상황에서, 조리 부담 없이 영양 균형을 유지할 수 있어 가장 안정적인 선택으로 평가되었습니다.',
            finalDecision: '건강식 정기 구독 도시락',
            satisfaction: 4,
            review: '아침 준비 시간이 크게 줄어서 만족스럽지만, 가끔 메뉴가 겹칠 때는 외식과 병행하고 있습니다.'
          };
          state.records = [sample].concat(state.records);
          persistRecords(state.records);
          render();
          return;
        }

        if (target.dataset.removeOption) {
          if (state.dilemma.options.length > 2) {
            state.dilemma.options = state.dilemma.options.filter(function (o) {
              return o.id !== target.dataset.removeOption;
            });
            render();
          }
          return;
        }

        if (target.dataset.deletePriority) {
          if (state.priorities.length > 1) {
            state.priorities = state.priorities.filter(function (p) {
              return p.id !== target.dataset.deletePriority;
            });
            render();
          }
          return;
        }

        if (target.dataset.simTab) {
          state.simActiveOptionId = target.dataset.simTab;
          render();
          return;
        }

        if (target.dataset.selectFinal) {
          state.selectedFinalOptionId = target.dataset.selectFinal;
          render();
          return;
        }

        if (target.dataset.editRecord) {
          var rec = state.records.find(function (r) { return r.id === target.dataset.editRecord; });
          if (rec) {
            state.editingRecordId = rec.id;
            state.confirmDeleteId = null;
            state.editFinalDecision = rec.finalDecision;
            state.editSatisfaction = rec.satisfaction;
            state.editReview = rec.review || '';
            render();
          }
          return;
        }

        if (target.dataset.cancelEdit) {
          state.editingRecordId = null;
          render();
          return;
        }

        if (target.dataset.setSat) {
          state.editSatisfaction = Number(target.dataset.setSat);
          render();
          return;
        }

        if (target.dataset.askDelete) {
          state.confirmDeleteId = target.dataset.askDelete;
          render();
          return;
        }

        if (target.dataset.cancelDelete) {
          state.confirmDeleteId = null;
          render();
          return;
        }

        if (target.dataset.confirmDelete) {
          var delId = target.dataset.confirmDelete;
          state.records = state.records.filter(function (r) { return r.id !== delId; });
          persistRecords(state.records);
          state.confirmDeleteId = null;
          if (state.currentRecordId === delId) state.currentRecordId = null;
          render();
          return;
        }
      });

      document.addEventListener('input', function (e) {
        var el = e.target;

        if (el.dataset && el.dataset.dilemmaField) {
          state.dilemma[el.dataset.dilemmaField] = el.value;
          return;
        }
        if (el.dataset && el.dataset.optField && el.dataset.optId) {
          var opt = state.dilemma.options.find(function (o) { return o.id === el.dataset.optId; });
          if (opt) opt[el.dataset.optField] = el.value;
          return;
        }
        if (el.dataset && el.dataset.prioritySlider) {
          var pId = el.dataset.prioritySlider;
          var val = Number(el.value);
          var p = state.priorities.find(function (item) { return item.id === pId; });
          if (p) {
            p.weight = val;
            // Live-update slider text & share percents without destroying slider focus
            var WEIGHT_LABELS = { 1: '거의 중요하지 않음', 2: '조금 중요함', 3: '보통', 4: '중요함', 5: '매우 중요함' };
            var shares = calculateWeightShares(state.priorities);
            shares.forEach(function (item) {
              var sEl = document.querySelector('[data-share-for="' + item.id + '"]');
              if (sEl) sEl.textContent = '반영 비중 ' + item.sharePercent + '% · ' + WEIGHT_LABELS[item.weight];
              var wEl = document.querySelector('[data-weight-label="' + item.id + '"]');
              if (wEl) wEl.textContent = item.weight + ' / 5';
            });
          }
          return;
        }
        if (el.id === 'new-priority-input') {
          state.newCriterionName = el.value;
          state.priorityAddError = null;
          return;
        }
        if (el.id === 'new-priority-weight') {
          state.newCriterionWeight = Number(el.value);
          return;
        }
        if (el.dataset && el.dataset.clarifyIdx !== undefined) {
          var idx = Number(el.dataset.clarifyIdx);
          if (state.clarifyingQuestions[idx]) {
            state.clarifyingQuestions[idx].answer = el.value;
          }
          return;
        }
        if (el.dataset && el.dataset.regretId) {
          state.regretAnswers[el.dataset.regretId] = el.value;
          state.regretError = null;
          return;
        }
        if (el.id === 'history-search-input') {
          state.historySearch = el.value;
          var pos = el.selectionStart;
          render();
          var nextInput = document.getElementById('history-search-input');
          if (nextInput) {
            nextInput.focus();
            try { nextInput.setSelectionRange(pos, pos); } catch (err) {}
          }
          return;
        }
        if (el.dataset && el.dataset.editDecision) {
          state.editFinalDecision = el.value;
          return;
        }
        if (el.dataset && el.dataset.editReview) {
          state.editReview = el.value;
          return;
        }
      });

      document.addEventListener('submit', function (e) {
        var form = e.target;

        if (form.id === 'dilemma-form') {
          e.preventDefault();
          var validation = validateDilemmaInput(state.dilemma);
          if (!validation.isValid) {
            state.inputErrors = validation.errors;
            state.inputSummaryErrors = validation.summaryMessages;
            render();
            scrollTop();
            return;
          }
          state.inputErrors = null;
          state.inputSummaryErrors = [];
          navigate('priorities');
          return;
        }

        if (form.id === 'add-priority-form') {
          e.preventDefault();
          var err = validateNewPriorityName(state.newCriterionName, state.priorities);
          if (err) {
            state.priorityAddError = err;
            render();
            return;
          }
          state.priorities.push({
            id: 'custom-' + Date.now(),
            name: state.newCriterionName.trim(),
            weight: state.newCriterionWeight,
            isDefault: false
          });
          state.newCriterionName = '';
          state.newCriterionWeight = 3;
          state.priorityAddError = null;
          render();
          return;
        }

        if (form.id === 'regret-check-form') {
          e.preventDefault();
          var r = state.analysisResult;
          var answers = r.regretCheckQuestions.map(function (q) {
            return { question: q.question, answer: state.regretAnswers[q.id] || '' };
          });
          var hasAny = answers.some(function (a) { return a.answer.trim().length > 0; });
          if (!hasAny) {
            state.regretError = '최소 1개 이상의 질문에 현재 생각을 적어 주세요.';
            render();
            return;
          }
          var cand = r.optionsAnalysis.find(function (o) {
            return o.optionId === state.selectedFinalOptionId;
          }) || r.optionsAnalysis[0];
          state.regretError = null;
          state.regretFeedback = generateRegretFeedback(state.dilemma.title, cand.optionName, answers);
          render();
          return;
        }

        if (form.dataset && form.dataset.saveEditForm) {
          e.preventDefault();
          var recId = form.dataset.saveEditForm;
          state.records = state.records.map(function (rec) {
            if (rec.id !== recId) return rec;
            return Object.assign({}, rec, {
              finalDecision: state.editFinalDecision.trim() || rec.finalDecision,
              satisfaction: state.editSatisfaction,
              review: state.editReview.trim(),
              updatedAt: new Date().toISOString()
            });
          });
          persistRecords(state.records);
          state.editingRecordId = null;
          render();
          return;
        }
      });

      // Initial render
      render();
    })();
  </script>
</body>
</html>
