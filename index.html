<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>결정나침반 — 당신의 선택에 방향을 더하다</title>
  <meta name="description" content="사용자의 상황과 우선순위를 다각도로 분석하여 합리적인 결정을 돕는 의사결정 보조 웹 앱" />
  <meta property="og:title" content="결정나침반 (DECISION COMPASS)" />
  <meta property="og:description" content="당신의 선택에 방향을 더하다 — 우선순위 가중 분석, 미래 시뮬레이션, 후회 방지 체크" />
  <meta property="og:type" content="website" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy-950: #0D172B;
      --navy-900: #14213D;
      --navy-800: #1E3158;
      --navy-700: #2C4476;
      --ivory-50: #FAF8F3;
      --ivory-100: #F4F0E6;
      --lavender-50: #F6F4FB;
      --lavender-100: #EBE6F6;
      --lavender-200: #D8CEF0;
      --lavender-300: #BEB0E4;
      --border-soft: #E4E0EE;
      --border-input: #D8D3E6;
      --text-primary: #14213D;
      --text-secondary: #3D4A60;
      --text-muted: #5A6578;
      --danger: #DC2626;
      --danger-bg: #FEF2F2;
      --danger-border: #FECACA;
      --success: #166534;
      --success-bg: #F0FDF4;
      --success-border: #BBF7D0;
      --warn: #92400E;
      --warn-bg: #FFFBEB;
      --warn-border: #FDE68A;
      --font-sans: "Noto Sans KR", "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;
      --shadow-sm: 0 1px 3px rgba(20, 33, 61, 0.05), 0 1px 2px rgba(20, 33, 61, 0.03);
      --radius-lg: 12px;
      --radius-xl: 16px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html {
      font-family: var(--font-sans);
      background-color: var(--ivory-50);
      color: var(--text-primary);
      scroll-behavior: smooth;
      -webkit-font-smoothing: antialiased;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: var(--ivory-50);
      color: var(--text-primary);
      line-height: 1.55;
      word-break: keep-all;
      overflow-wrap: break-word;
    }

    ::selection {
      background-color: #E5DFF3;
      color: var(--navy-900);
    }

    button, input, textarea, select {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
      outline: 2px solid var(--navy-900);
      outline-offset: 2px;
    }

    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }

    .mono {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
    }

    /* Layout Containers */
    .container {
      max-width: 1160px;
      margin: 0 auto;
      padding-left: 24px;
      padding-right: 24px;
    }

    .container-narrow {
      max-width: 920px;
      margin: 0 auto;
      padding-left: 24px;
      padding-right: 24px;
    }

    .container-results {
      max-width: 1060px;
      margin: 0 auto;
      padding-left: 24px;
      padding-right: 24px;
    }

    /* Header (Strict 3-zone Top Bar Contract) */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 30;
      background-color: rgba(250, 248, 243, 0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border-soft);
    }

    .header-inner {
      max-width: 1160px;
      margin: 0 auto;
      padding: 0 24px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 32px;
    }

    .brand-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: none;
      border: none;
      padding: 4px;
      border-radius: 8px;
      white-space: nowrap;
      flex-shrink: 0;
      color: var(--navy-900);
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .desktop-nav {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .nav-link {
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      padding: 6px 2px;
      font-size: 14px;
      font-weight: 500;
      color: #4B5568;
      white-space: nowrap;
      flex-shrink: 0;
      transition: color 150ms ease, border-color 150ms ease;
    }

    .nav-link:hover {
      color: var(--navy-900);
      border-bottom-color: var(--lavender-300);
    }

    .nav-link.active {
      color: var(--navy-900);
      border-bottom-color: var(--navy-900);
      font-weight: 600;
    }

    .mobile-nav {
      display: none;
      border-top: 1px solid var(--border-soft);
      padding: 6px 12px;
      background-color: var(--ivory-50);
      justify-content: space-around;
      gap: 6px;
    }

    .mobile-nav-link {
      background: none;
      border: none;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      color: #4B5568;
      white-space: nowrap;
      min-height: 36px;
    }

    .mobile-nav-link.active {
      background-color: var(--lavender-100);
      color: var(--navy-900);
      font-weight: 600;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: var(--radius-lg);
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
      border: 1px solid transparent;
      transition: background-color 150ms cubic-bezier(0.16, 1, 0.3, 1), border-color 150ms ease, color 150ms ease;
    }

    .btn:disabled {
      opacity: 0.42;
      cursor: not-allowed;
    }

    .btn-primary {
      background-color: var(--navy-900);
      color: var(--ivory-50);
      padding: 12px 24px;
      font-size: 15px;
      min-height: 46px;
      box-shadow: var(--shadow-sm);
    }

    .btn-primary:hover:not(:disabled) {
      background-color: var(--navy-800);
    }

    .btn-header {
      background-color: var(--navy-900);
      color: var(--ivory-50);
      padding: 8px 16px;
      font-size: 13px;
      min-height: 40px;
      box-shadow: var(--shadow-sm);
    }

    .btn-header:hover {
      background-color: var(--navy-800);
    }

    .btn-secondary {
      background-color: #FFFFFF;
      color: var(--navy-900);
      border-color: var(--border-input);
      padding: 12px 20px;
      font-size: 15px;
      min-height: 46px;
    }

    .btn-secondary:hover:not(:disabled) {
      background-color: var(--lavender-50);
    }

    .btn-lavender {
      background-color: var(--lavender-100);
      color: var(--navy-900);
      border-color: var(--lavender-200);
      padding: 10px 18px;
      font-size: 14px;
      min-height: 42px;
    }

    .btn-lavender:hover:not(:disabled) {
      background-color: #DFD7F2;
    }

    .btn-sm {
      padding: 8px 14px;
      font-size: 13px;
      min-height: 36px;
      border-radius: 10px;
    }

    .btn-danger-ghost {
      background: transparent;
      color: #6B7280;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 500;
      min-height: 34px;
      border-radius: 8px;
    }

    .btn-danger-ghost:hover:not(:disabled) {
      color: var(--danger);
      background-color: var(--danger-bg);
    }

    .btn-danger-solid {
      background-color: var(--danger);
      color: #FFFFFF;
      padding: 8px 12px;
      font-size: 12px;
      min-height: 34px;
      border-radius: 8px;
    }

    .btn-danger-solid:hover {
      background-color: #B91C1C;
    }

    /* Main Content */
    main {
      flex: 1;
    }

    .page-section {
      padding-top: 40px;
      padding-bottom: 48px;
    }

    .stack-lg > * + * { margin-top: 48px; }
    .stack-md > * + * { margin-top: 32px; }
    .stack-sm > * + * { margin-top: 16px; }
    .stack-xs > * + * { margin-top: 8px; }

    /* Cards & Surfaces */
    .card {
      background-color: #FFFFFF;
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-xl);
      padding: 28px;
      box-shadow: var(--shadow-sm);
    }

    .card-lavender {
      background-color: var(--lavender-50);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-xl);
      padding: 28px;
      box-shadow: var(--shadow-sm);
    }

    .card-ivory {
      background-color: rgba(244, 240, 230, 0.72);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-xl);
      padding: 24px;
    }

    .card-navy {
      background-color: var(--navy-900);
      color: var(--ivory-50);
      border-radius: var(--radius-xl);
      padding: 32px;
      box-shadow: var(--shadow-sm);
    }

    /* Typography */
    .h1-hero {
      font-size: clamp(2rem, 4vw, 2.75rem);
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -0.025em;
      color: var(--navy-900);
      margin: 0;
      text-wrap: balance;
    }

    .h1-page {
      font-size: clamp(1.5rem, 2.8vw, 1.95rem);
      font-weight: 700;
      line-height: 1.28;
      letter-spacing: -0.02em;
      color: var(--navy-900);
      margin: 0;
    }

    .h2-section {
      font-size: clamp(1.25rem, 2.2vw, 1.5rem);
      font-weight: 700;
      line-height: 1.3;
      color: var(--navy-900);
      margin: 0;
    }

    .h3-card {
      font-size: 18px;
      font-weight: 700;
      color: var(--navy-900);
      margin: 0;
    }

    .kicker {
      font-size: 13px;
      font-weight: 600;
      color: #4B5568;
      letter-spacing: 0.02em;
      margin: 0;
    }

    .lead {
      font-size: 17px;
      color: var(--text-secondary);
      line-height: 1.65;
      max-width: 60ch;
      margin: 0;
    }

    .muted {
      font-size: 14px;
      color: var(--text-muted);
      margin: 0;
    }

    .text-link {
      background: none;
      border: none;
      padding: 4px 2px;
      font-size: 14px;
      font-weight: 600;
      color: var(--navy-900);
      text-decoration: underline;
      text-underline-offset: 4px;
      text-decoration-color: var(--lavender-300);
    }

    .text-link:hover {
      text-decoration-color: var(--navy-900);
    }

    /* Grids */
    .hero-grid {
      display: grid;
      grid-template-columns: 7fr 5fr;
      gap: 44px;
      align-items: stretch;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    .grid-reason {
      display: grid;
      grid-template-columns: 7fr 5fr;
      gap: 24px;
    }

    /* Hero Illustration Container */
    .hero-visual {
      border-radius: var(--radius-xl);
      border: 1px solid var(--border-soft);
      background: linear-gradient(145deg, #F6F4FB 0%, #FAF8F3 52%, #EFEADF 100%);
      overflow: hidden;
      min-height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-sm);
    }

    .feature-icon-box {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background-color: var(--lavender-100);
      color: var(--navy-900);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-lavender .feature-icon-box {
      background-color: #FFFFFF;
      border: 1px solid var(--border-soft);
    }

    /* Form Controls */
    .field-label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      color: var(--navy-900);
      margin-bottom: 6px;
    }

    .required-mark {
      color: #B91C1C;
    }

    .input, .textarea, .select {
      width: 100%;
      padding: 11px 14px;
      font-size: 14px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-input);
      background-color: rgba(250, 248, 243, 0.65);
      color: var(--navy-900);
      transition: border-color 150ms ease, background-color 150ms ease;
    }

    .input:focus, .textarea:focus, .select:focus {
      background-color: #FFFFFF;
      border-color: var(--navy-900);
    }

    .input.error, .textarea.error {
      border-color: var(--danger);
    }

    .error-text {
      font-size: 12px;
      font-weight: 500;
      color: var(--danger);
      margin: 4px 0 0;
    }

    .alert-box {
      border-radius: var(--radius-xl);
      padding: 16px 20px;
      font-size: 14px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .alert-danger {
      background-color: var(--danger-bg);
      border: 1px solid var(--danger-border);
      color: #991B1B;
      flex-direction: column;
    }

    .alert-info {
      background-color: var(--ivory-100);
      border: 1px solid var(--border-soft);
      color: var(--text-secondary);
    }

    .alert-lavender {
      background-color: var(--lavender-50);
      border: 1px solid var(--lavender-200);
      color: var(--navy-900);
    }

    .alert-warn {
      background-color: var(--warn-bg);
      border: 1px solid var(--warn-border);
      color: var(--warn);
    }

    .alert-success {
      background-color: var(--success-bg);
      border: 1px solid var(--success-border);
      color: var(--success);
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }

    /* Slider */
    input[type="range"].compass-slider {
      -webkit-appearance: none;
      appearance: none;
      height: 6px;
      border-radius: 9999px;
      background: var(--border-soft);
      flex: 1;
    }

    input[type="range"].compass-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 9999px;
      background: var(--navy-900);
      border: 2px solid var(--ivory-50);
      box-shadow: 0 1px 4px rgba(20, 33, 61, 0.25);
      cursor: pointer;
    }

    input[type="range"].compass-slider::-moz-range-thumb {
      width: 20px;
      height: 20px;
      border-radius: 9999px;
      background: var(--navy-900);
      border: 2px solid var(--ivory-50);
      box-shadow: 0 1px 4px rgba(20, 33, 61, 0.25);
      cursor: pointer;
    }

    /* Priority Row */
    .priority-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 16px 0;
      border-bottom: 1px solid #F0EDF6;
    }

    .priority-row:first-child { padding-top: 0; }
    .priority-row:last-child { border-bottom: none; padding-bottom: 0; }

    /* Table */
    .table-wrap {
      background-color: #FFFFFF;
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-sm);
      overflow-x: auto;
    }

    table.compare-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 660px;
      text-align: left;
    }

    table.compare-table th {
      background-color: var(--lavender-50);
      border-bottom: 1px solid var(--border-soft);
      padding: 14px 16px;
      font-size: 13px;
      font-weight: 700;
      color: var(--navy-900);
    }

    table.compare-table td {
      padding: 14px 16px;
      font-size: 14px;
      border-bottom: 1px solid #F0EDF6;
      vertical-align: top;
      color: var(--text-secondary);
    }

    table.compare-table tr:last-child td {
      border-bottom: none;
      background-color: var(--ivory-50);
      font-weight: 700;
      color: var(--navy-900);
    }

    /* Score Bars */
    .bar-track {
      height: 10px;
      width: 100%;
      background-color: #F0EDF6;
      border-radius: 9999px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      border-radius: 9999px;
      transition: width 300ms ease;
    }

    /* Segmented Tabs */
    .tablist {
      display: inline-flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 6px;
      background-color: rgba(235, 230, 246, 0.72);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-lg);
    }

    .tab-btn {
      border: none;
      background: transparent;
      color: var(--text-secondary);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      min-height: 38px;
      white-space: nowrap;
      transition: background-color 150ms ease, color 150ms ease;
    }

    .tab-btn.active {
      background-color: var(--navy-900);
      color: var(--ivory-50);
      box-shadow: var(--shadow-sm);
    }

    /* Flat simulation inner blocks (no nested borders) */
    .sim-block-ivory {
      background-color: rgba(250, 248, 243, 0.85);
      border-radius: var(--radius-lg);
      padding: 20px;
    }

    .sim-block-lavender {
      background-color: rgba(246, 244, 251, 0.85);
      border-radius: var(--radius-lg);
      padding: 20px;
    }

    /* Footer */
    .site-footer {
      border-top: 1px solid var(--border-soft);
      background-color: var(--ivory-50);
      padding: 24px 0;
      margin-top: 48px;
    }

    .footer-inner {
      max-width: 1160px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Utility flex */
    .flex-row { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; }
    .flex-between { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
    .divider-top { border-top: 1px solid var(--border-soft); padding-top: 16px; }
    .divider-bottom { border-bottom: 1px solid var(--border-soft); padding-bottom: 14px; }

    @keyframes pulseSoft {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.72; transform: scale(0.96); }
    }

    .animate-compass {
      animation: pulseSoft 1.4s ease-in-out infinite;
    }

    /* Responsive Breakpoints */
    @media (max-width: 900px) {
      .hero-grid, .grid-reason {
        grid-template-columns: 1fr;
        gap: 28px;
      }
      .grid-3 {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 767px) {
      .desktop-nav {
        display: none;
      }
      .mobile-nav {
        display: flex;
      }
      .header-inner {
        padding: 0 16px;
        gap: 12px;
        height: 58px;
      }
      .container, .container-narrow, .container-results {
        padding-left: 16px;
        padding-right: 16px;
      }
      .grid-2 {
        grid-template-columns: 1fr;
      }
      .priority-row {
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
      }
      .card, .card-lavender, .card-navy {
        padding: 20px;
      }
      .page-section {
        padding-top: 28px;
        padding-bottom: 36px;
      }
      .hero-visual {
        min-height: 220px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <header class="site-header" id="site-header"></header>
  <main id="app-main"></main>
  <footer class="site-footer">
    <div class="footer-inner">
      <p style="margin:0;">결정나침반 (DECISION COMPASS) · 당신의 선택에 방향을 더하다</p>
      <p style="margin:0;">분석 결과는 의사결정을 돕는 참고용이며 최종 선택은 사용자의 판단에 따릅니다.</p>
    </div>
  </footer>

  <script>
    (function () {
      'use strict';

      /* =========================================================
       * 1. SVG Icons & Editorial Compass Illustration
       * ========================================================= */
      function compassSvg(sizeClass) {
        var cls = sizeClass || '';
        return '<svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg" class="' + cls + '" style="width:28px;height:28px;flex-shrink:0;" aria-hidden="true">' +
          '<circle cx="18" cy="18" r="16" stroke="#14213D" stroke-width="2" fill="#FAF8F3"/>' +
          '<circle cx="18" cy="18" r="11.5" stroke="#BEB0E4" stroke-width="1.2"/>' +

      function loadRecords() {
        try {
          var raw = window.localStorage.getItem(STORAGE_KEY);
          if (!raw) return [];
          var parsed = JSON.parse(raw);
          if (!Array.isArray(parsed)) return [];
          return parsed.filter(function (item) {
            return item && typeof item.id === 'string' && typeof item.title === 'string' && Array.isArray(item.options);
          });
        } catch (e) {
          return [];
        }
      }

      function persistRecords(records) {
        try {
          window.localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
        } catch (e) {
          // Ignore quota errors cleanly
        }
      }

      function formatKoreanDate(isoString) {
        try {
          return new Intl.DateTimeFormat('ko-KR', {
            year: 'numeric',
            month: 'long',
            day: 'numeric'
          }).format(new Date(isoString));
        } catch (e) {
          return String(isoString || '').slice(0, 10);
        }
      }

      /* =========================================================
       * 3. Validation & Scoring Engine
       * ========================================================= */
      function validateDilemmaInput(input) {
        var errors = { options: {} };
        var summary = [];

        if (!input.title.trim()) {
          errors.title = '고민의 제목을 입력해 주세요.';
          summary.push('고민의 제목이 비어 있습니다.');
        } else if (input.title.trim().length < 2) {
          errors.title = '고민의 제목은 2글자 이상 입력해 주세요.';
          summary.push('고민의 제목을 조금 더 구체적으로 입력해 주세요.');
        }

        if (!input.situation.trim()) {
          errors.situation = '고민이 발생한 상황과 이유를 입력해 주세요.';
          summary.push('고민의 상황과 이유가 비어 있습니다.');
        } else if (input.situation.trim().length < 10) {
          errors.situation = '정확한 분석을 위해 상황을 10글자 이상 구체적으로 작성해 주세요.';
          summary.push('고민 상황을 10글자 이상으로 작성해 주세요.');
        }

        if (input.options.length < 2) {
          errors.optionsGeneral = '비교할 선택지는 최소 2개 이상이어야 합니다.';
          summary.push('비교할 선택지를 최소 2개 이상 등록해 주세요.');
        } else if (input.options.length > 5) {
          errors.optionsGeneral = '선택지는 최대 5개까지 비교할 수 있습니다.';
          summary.push('선택지는 최대 5개까지만 비교할 수 있습니다.');
        }

        var seenNames = {};
        input.options.forEach(function (opt, idx) {
          var optErr = {};
          var tName = opt.name.trim();
          var tFeatures = opt.features.trim();

          if (!tName) {
            optErr.name = '선택지 ' + (idx + 1) + '의 이름을 입력해 주세요.';
            summary.push('선택지 ' + (idx + 1) + '의 이름이 비어 있습니다.');
          } else if (seenNames[tName.toLowerCase()]) {
            optErr.name = '서로 다른 이름의 선택지를 입력해 주세요.';
            summary.push("중복된 선택지 이름('" + tName + "')이 있습니다.");
          } else {
            seenNames[tName.toLowerCase()] = true;
          }

          if (!tFeatures) {
            optErr.features = '선택지 ' + (idx + 1) + '의 특징과 장점을 입력해 주세요.';
            summary.push('선택지 ' + (idx + 1) + '의 특징과 장점이 비어 있습니다.');
          }

          if (optErr.name || optErr.features) {
            errors.options[opt.id] = optErr;
          }
        });

        return {
          isValid: summary.length === 0,
          errors: errors,
          summaryMessages: summary
        };
      }

      function validateNewPriorityName(name, existing) {
        var trimmed = name.trim();
        if (!trimmed) return '추가할 기준 이름을 입력해 주세요.';
        if (trimmed.length > 20) return '기준 이름은 20글자 이내로 입력해 주세요.';
        var dup = existing.some(function (p) {
          return p.name.trim().toLowerCase() === trimmed.toLowerCase();
        });
        if (dup) return '이미 같은 이름의 기준이 목록에 있습니다.';
        return null;
      }

      function calculateWeightShares(priorities) {
        var total = priorities.reduce(function (acc, p) {
          return acc + Math.max(1, Math.min(5, p.weight));
        }, 0);
        if (total === 0) {
          return priorities.map(function (p) {
            return Object.assign({}, p, { sharePercent: 0 });
          });
        }
        return priorities.map(function (p) {
          var w = Math.max(1, Math.min(5, p.weight));
          return Object.assign({}, p, { sharePercent: Math.round((w / total) * 1000) / 10 });
        });
      }

      function calculateWeightedScore(criterionScores, priorities) {
        var weightedSum = 0;
        var weightTotal = 0;
        var scoredCount = 0;

        criterionScores.forEach(function (item) {
          var priority = priorities.find(function (p) {
            return p.id === item.criterionId || p.name.trim() === item.criterionName.trim();
          });
          if (!priority) return;

          if (!item.insufficientInfo && typeof item.score === 'number' && !isNaN(item.score)) {
            var cScore = Math.min(5, Math.max(1, item.score));
            var cWeight = Math.min(5, Math.max(1, priority.weight));
            weightedSum += cScore * cWeight;
            weightTotal += cWeight;
            scoredCount += 1;
          }
        });

        if (weightTotal === 0 || scoredCount === 0) {
          return { weightedScore: null, scoredCriteriaCount: 0, totalCriteriaCount: priorities.length };
        }

        return {
          weightedScore: Math.round((weightedSum / weightTotal) * 100) / 100,
          scoredCriteriaCount: scoredCount,
          totalCriteriaCount: priorities.length
        };
      }

      function detectSensitiveDomain(title, situation, constraints) {
        var combined = (title + ' ' + situation + ' ' + (constraints || '')).toLowerCase();
        var groups = [
          { cat: '의료·건강', words: ['수술', '병원', '치료', '약물', '진단', '질환', '시술', '의사', '치과', '정신과', '처방'] },
          { cat: '법률·계약', words: ['소송', '고소', '계약서', '법률', '변호사', '합의금', '분쟁', '위자료', '임대차', '해고'] },
          { cat: '금융·투자', words: ['주식', '코인', '가상화폐', '대출', '부동산 투자', '청약', '펀드', '적금', '연금', '세금', '전세자금'] }
        ];
        var matched = groups.filter(function (g) {
          return g.words.some(function (w) { return combined.indexOf(w) !== -1; });
        }).map(function (g) { return g.cat; });

        if (matched.length === 0) return null;
        return '입력하신 고민에 ' + matched.join(', ') + ' 관련 판단 요소가 포함되어 있습니다. 본 분석은 생각을 정리하기 위한 참고 자료일 뿐이므로, 실제 실행 전 반드시 해당 분야의 전문가(의사, 변호사, 공인 재무설계사 등)와 상담하시기 바랍니다.';
      }

      /* =========================================================
       * 4. Context-Aware Decision & Simulation Engine (Client-side)
       * ========================================================= */
      function buildClarifyingQuestions(dilemma, priorities) {
        var questions = [];
        var missingCost = dilemma.options.some(function (o) { return !o.costOrTime.trim(); });
        var sorted = priorities.slice().sort(function (a, b) { return b.weight - a.weight; });
        var topPriority = sorted[0] ? sorted[0].name : '만족도';

        if (missingCost) {
          questions.push('예상 비용이나 소요 시간이 비어 있는 선택지가 있습니다. 대략적인 예산이나 투자 가능한 시간 범위가 있으신가요?');
        }
        if (!dilemma.constraints.trim()) {
          questions.push('이 결정을 내릴 때 절대 포기할 수 없는 조건이나 피하고 싶은 제약사항이 있다면 무엇인가요?');
        }
        if (dilemma.situation.trim().length < 45) {
          questions.push('가장 중요하게 보시는 "' + topPriority + '" 기준에서 이번 선택이 앞으로 어떤 변화를 주길 바라시나요?');
        }

        return questions.slice(0, 3);
      }

      function parseEstimatedCostInManwon(text) {
        if (!text) return null;
        var s = text.replace(/,/g, '');
        if (/무료|0원|비용\s*(거의\s*)?없음/.test(s)) return 0;
        var manMatch = s.match(/(\d+(?:\.\d+)?)\s*만\s*원?/);
        if (manMatch) return parseFloat(manMatch[1]);
        var wonMatch = s.match(/(\d+(?:\.\d+)?)\s*원/);
        if (wonMatch) return parseFloat(wonMatch[1]) / 10000;
        return null;
      }

      function parseEstimatedMinutes(text) {
        if (!text) return null;
        var s = text;
        if (/0분|이동\s*시간\s*없음|바로/.test(s)) return 5;
        var total = 0;
        var matched = false;
        var hourMatch = s.match(/(\d+(?:\.\d+)?)\s*시간/);
        if (hourMatch) { total += parseFloat(hourMatch[1]) * 60; matched = true; }
        var minMatch = s.match(/(\d+(?:\.\d+)?)\s*분/);
        if (minMatch) { total += parseFloat(minMatch[1]); matched = true; }
        if (/반나절/.test(s)) { total += 240; matched = true; }
        if (/1~2주|1주|일주일/.test(s)) { total += 600; matched = true; }
        return matched ? total : null;
      }

      function splitFeaturePhrases(text) {
        return (text || '')
          .split(/[,/\n]|\.\s+/)
          .map(function (s) { return s.trim(); })
          .filter(function (s) { return s.length >= 2; });
      }

      function scoreOptionOnCriterion(opt, allOptions, criterion, dilemma, clarifText) {
        var text = (opt.name + ' ' + opt.features + ' ' + opt.costOrTime).toLowerCase();
        var ctx = (dilemma.situation + ' ' + dilemma.constraints + ' ' + clarifText).toLowerCase();
        var cId = criterion.id;
        var cName = criterion.name.trim();

        // 1) Cost
        if (cId === 'cost' || cName.indexOf('비용') !== -1 || cName.indexOf('가격') !== -1 || cName.indexOf('예산') !== -1) {
          var costs = allOptions.map(function (o) { return parseEstimatedCostInManwon(o.costOrTime + ' ' + o.features); });
          var myCost = parseEstimatedCostInManwon(opt.costOrTime + ' ' + opt.features);
          if (myCost === null && !/저렴|무료|가성비|아낄|절약|비용|부담/.test(text)) {
            return { score: null, insufficientInfo: true, rationale: '예상 비용 정보가 입력되지 않아 정보 부족으로 처리했습니다.' };
          }
          if (myCost !== null) {
            var known = costs.filter(function (v) { return v !== null; });
            var maxC = Math.max.apply(null, known.concat([1]));
            var minC = Math.min.apply(null, known);
            var ratio = maxC === minC ? 0.5 : (myCost - minC) / (maxC - minC);
            var sc = Math.round((5 - ratio * 2.5) * 10) / 10;
            if (myCost === 0 || /아낄|절약|이내/.test(text)) sc = Math.min(5, Math.max(sc, 4.5));
            return {
              score: Math.min(5, Math.max(1, Math.round(sc * 2) / 2)),
              insufficientInfo: false,
              rationale: '입력된 예상 비용(' + (myCost === 0 ? '최소 지출' : myCost + '만 원 수준') + ')을 기준으로 상대적 부담을 평가했습니다.'
            };
          }
          var kwScore = /저렴|아낄|절약|가성비/.test(text) ? 4.5 : 3;
          return { score: kwScore, insufficientInfo: false, rationale: '특징에 기재된 비용 절감 요소를 반영했습니다.' };
        }

        // 2) Time
        if (cId === 'time' || cName.indexOf('시간') !== -1 || cName.indexOf('기간') !== -1) {
          var mins = allOptions.map(function (o) { return parseEstimatedMinutes(o.costOrTime + ' ' + o.features); });
          var myMin = parseEstimatedMinutes(opt.costOrTime + ' ' + opt.features);
          if (myMin === null && !/빠르|즉시|바로|오래|단축|시간|적응/.test(text)) {
            return { score: null, insufficientInfo: true, rationale: '소요 시간 정보가 입력되지 않아 정보 부족으로 처리했습니다.' };
          }
          if (myMin !== null) {
            var knownM = mins.filter(function (v) { return v !== null; });
            var maxM = Math.max.apply(null, knownM.concat([1]));
            var minM = Math.min.apply(null, knownM);
            var r = maxM === minM ? 0.5 : (myMin - minM) / (maxM - minM);
            var scM = 4.8 - r * 2.3;
            return {
              score: Math.min(5, Math.max(1, Math.round(scM * 2) / 2)),
              insufficientInfo: false,
              rationale: '입력된 소요 시간 및 준비 부담을 비교하여 산출했습니다.'
            };
          }
          var kwTime = /바로|즉시|단축|빠르/.test(text) ? 4.5 : /적응|왕복/.test(text) ? 3 : 3.5;
          return { score: kwTime, insufficientInfo: false, rationale: '준비 및 적응 소요 문구를 참고해 평가했습니다.' };
        }

        // 3) Convenience
        if (cId === 'convenience' || cName.indexOf('편리') !== -1 || cName.indexOf('호환') !== -1 || cName.indexOf('접근') !== -1) {
          var convPts = 3.0;
          if (/호환|익숙|가벼|경량|이동\s*시간\s*0|근처|유연|바로|무소음|휴대/.test(text)) convPts += 1.2;
          if (/배터리\s*오래|트랙패드|포트\s*다양|불필요/.test(text)) convPts += 0.5;
          if (/방문|적응\s*기간|왕복|강제성/.test(text)) convPts -= 0.7;
          if (/hwp|엑셀|문서/.test(ctx) && /윈도우|호환/.test(text)) convPts += 0.5;
          if (/백팩|이동/.test(ctx) && /가벼|경량|휴대|0분|근처/.test(text)) convPts += 0.4;
          return {
            score: Math.min(5, Math.max(1.5, Math.round(convPts * 2) / 2)),
            insufficientInfo: false,
            rationale: '사용 편의성, 이동·적응 부담 및 일상 환경과의 호환성을 반영했습니다.'
          };
        }

        // 4) Satisfaction
        if (cId === 'satisfaction' || cName.indexOf('만족') !== -1 || cName.indexOf('품질') !== -1 || cName.indexOf('성능') !== -1) {
          var satPts = 3.2;
          if (/완성도|개선|회복|도움|건강|오래감|무소음|해소|향상/.test(text)) satPts += 1.1;
          if (/100%|초경량|디스플레이|투자/.test(text)) satPts += 0.5;
          if (/기존.*1년|임시|유지/.test(text)) satPts -= 0.7;
          return {
            score: Math.min(5, Math.max(2, Math.round(satPts * 2) / 2)),
            insufficientInfo: false,
            rationale: '입력된 장점과 고민 해결 기여도를 바탕으로 체감 만족도를 추정했습니다.'
          };
        }

        // 5) Fun
        if (cId === 'fun' || cName.indexOf('재미') !== -1 || cName.indexOf('흥미') !== -1 || cName.indexOf('즐거') !== -1) {
          var funPts = 2.8;
          if (/교류|새로운|자유로운|독서|취미|매력|디스플레이|다양/.test(text)) funPts += 1.2;
          if (/스트레스\s*해소|휴식/.test(text)) funPts += 0.6;
          if (/기존|유지|반나절|단순/.test(text)) funPts -= 0.5;
          return {
            score: Math.min(5, Math.max(1.5, Math.round(funPts * 2) / 2)),
            insufficientInfo: false,
            rationale: '일상 속 신선함과 정서적 즐거움 요소를 기준으로 평가했습니다.'
          };
        }

        // 6) Sustainability
        if (cId === 'sustainability' || cName.indexOf('지속') !== -1 || cName.indexOf('장기') !== -1 || cName.indexOf('유지') !== -1) {
          var susPts = 3.0;
          if (/지속|꾸준|장기|환경|3년|회복|유연|루틴|강제성|건강/.test(text)) susPts += 1.3;
          if (/무소음|배터리\s*오래/.test(text)) susPts += 0.7;
          if (/1년\s*더|임시/.test(text)) susPts -= 0.8;
          if (/피로|취침/.test(ctx) && /왕복|2시간\s*30분/.test(text)) susPts -= 0.6;
          return {
            score: Math.min(5, Math.max(1.5, Math.round(susPts * 2) / 2)),
            insufficientInfo: false,
            rationale: '시간이 지나도 무리 없이 꾸준히 이어갈 수 있는 지속성을 반영했습니다.'
          };
        }

        // 7) Custom user-added criterion
        var tokens = cName.split(/\s+/).filter(function (w) { return w.length >= 2; });
        var hasMatch = tokens.some(function (t) { return text.indexOf(t.toLowerCase()) !== -1; });
        if (!hasMatch && opt.features.trim().length < 18) {
          return {
            score: null,
            insufficientInfo: true,
            rationale: "'" + cName + "' 기준을 판단할 구체적 단서가 부족해 정보 부족으로 표시했습니다."
          };
        }
        var customScore = hasMatch ? 4.5 : 3.2;
        return {
          score: customScore,
          insufficientInfo: false,
          rationale: hasMatch
            ? "선택지 설명에 '" + cName + "' 관련 강점이 드러나 있어 긍정적으로 반영했습니다."
            : "입력된 선택지 특징을 바탕으로 '" + cName + "' 관점의 일반적 적합도를 추정했습니다."
        };
      }

      function analyzeDecision(dilemma, priorities, clarifications) {
        var clarifText = (clarifications || [])
          .filter(function (c) { return c.answer && c.answer.trim(); })
          .map(function (c) { return c.question + ': ' + c.answer; })
          .join(' / ');

        var sortedPriorities = priorities.slice().sort(function (a, b) { return b.weight - a.weight; });
        var topPriorities = sortedPriorities.filter(function (p) { return p.weight >= 4; }).slice(0, 3);
        if (topPriorities.length === 0) topPriorities = sortedPriorities.slice(0, 2);
        var topPriorityNames = topPriorities.map(function (p) { return p.name; }).join(', ');

        var optionsAnalysis = dilemma.options.map(function (opt) {
          var criterionScores = priorities.map(function (p) {
            var evaluated = scoreOptionOnCriterion(opt, dilemma.options, p, dilemma, clarifText);
            return {
              criterionId: p.id,
              criterionName: p.name,
              score: evaluated.score,
              insufficientInfo: evaluated.insufficientInfo,
              rationale: evaluated.rationale
            };
          });

          var stats = calculateWeightedScore(criterionScores, priorities);
          var featurePhrases = splitFeaturePhrases(opt.features);
          var pros = featurePhrases.slice(0, 3);
          if (pros.length === 0) pros.push(opt.features.trim());

          // Build honest, balanced cons from trade-offs & missing data
          var cons = [];
          var parsedCost = parseEstimatedCostInManwon(opt.costOrTime);
          var parsedMin = parseEstimatedMinutes(opt.costOrTime);
          if (parsedCost !== null && parsedCost >= 100) {
            cons.push('초기 지출(' + opt.costOrTime.split('/')[0].trim() + ') 규모가 비교적 커서 예산 배분 확인이 필요합니다.');
          } else if (parsedCost !== null && parsedCost > 10) {
            cons.push('고정 또는 반복 지출 부담이 발생할 수 있어 가용 예산과 대조해 보아야 합니다.');
          }
          if (parsedMin !== null && parsedMin >= 90) {
            cons.push('준비 또는 이동·적응에 일정 시간(' + opt.costOrTime.trim() + ')이 소요될 수 있습니다.');
          }
          if (!opt.costOrTime.trim()) {
            cons.push('예상 비용 및 소요 시간 정보가 비어 있어 실제 부담을 사전에 확인해야 합니다.');
          }
          var lowestScored = criterionScores
            .filter(function (c) { return !c.insufficientInfo && c.score !== null; })
            .sort(function (a, b) { return a.score - b.score; })[0];
          if (lowestScored && lowestScored.score <= 3.5 && cons.length < 2) {
            cons.push("'" + lowestScored.criterionName + "' 기준에서는 다른 대안 대비 상대적인 아쉬움이 남을 수 있습니다.");
          }
          if (cons.length === 0) {
            cons.push('선택 이후 실제 체감 조건이 초기 기대와 다를 수 있으므로 세부 조건을 한 번 더 점검하는 것이 좋습니다.');
          }

          var bestCriteria = criterionScores
            .filter(function (c) { return !c.insufficientInfo && c.score !== null; })
            .sort(function (a, b) { return b.score - a.score; })
            .slice(0, 2)
            .map(function (c) { return c.criterionName; });

          var priorityFit = bestCriteria.length > 0
            ? "설정하신 우선순위 중 특히 '" + bestCriteria.join("', '") + "' 측면에서 균형 잡힌 강점을 보이며, 중점 기준(" + topPriorityNames + ")과의 조화가 양호한 편입니다."
            : '입력된 정보가 제한적이지만, 핵심 특징을 중심으로 기본적인 적합성을 정리했습니다.';

          var expectedOutcome = "'" + opt.name + "' 선택 시 " + (pros[0] ? pros[0] + ' 등의 이점이 체감될 가능성이 있습니다.' : '기대했던 방향의 변화를 경험할 수 있습니다.') +
            (opt.costOrTime.trim() ? ' (' + opt.costOrTime.trim() + ' 기준)' : '');

          var confirmedFacts = [
            "선택지 특징: " + opt.features.trim(),
            opt.costOrTime.trim() ? "기재된 비용·시간: " + opt.costOrTime.trim() : '비용 및 소요 시간: 미입력(정보 부족)'
          ];
          if (dilemma.constraints.trim()) {
            confirmedFacts.push('제약 조건: ' + dilemma.constraints.trim());
          }

          var aiAssumptions = [
            "기재된 장점('" + (pros[0] || opt.name) + "')이 실제 실행 과정에서도 일관되게 유지된다고 가정했습니다.",
            '외부 환경 변수(예기치 못한 일정 변화, 가격 변동 등)는 현재와 유사한 수준으로 유지된다는 전제에서 시나리오를 구성했습니다.'
          ];

          var futureSimulation = {
            positiveOutcomes: [
              "가장 중시하신 '" + topPriorityNames + "' 관점에서 고민의 핵심 원인이 점진적으로 완화될 가능성이 있습니다.",
              pros[0] ? "'" + pros[0] + "' 효과가 일상에 자리 잡으며 심리적 만족감이 높아질 수 있습니다." : '선택 이후 실행 동력이 안정적으로 유지될 수 있습니다.'
            ],
            negativeOutcomes: [
              cons[0] || '초기 기대와 달리 적응 과정에서 소소한 불편함이 나타날 가능성이 있습니다.',
              '다른 선택지가 제공하던 대안적 기회(기회비용)에 대해 일시적인 아쉬움이 들 수 있습니다.'
            ],
            longTermConsiderations: [
              '몇 달 뒤 생활 패턴이나 예산 상황이 달라졌을 때도 이 선택을 무리 없이 유지·관리할 수 있는지 점검해 보세요.',
              dilemma.constraints.trim()
                ? "명시하신 조건('" + dilemma.constraints.trim().slice(0, 45) + (dilemma.constraints.trim().length > 45 ? '...' : '') + "')과 장기적으로 충돌하지 않는지 확인이 필요합니다."
                : '시간이 지난 뒤 변경하거나 되돌릴 수 있는 유연성이 충분한지 살펴보는 것이 좋습니다.'
            ],
            thingsToCheck: [
              !opt.costOrTime.trim() ? '실제 소요 비용과 일정을 구체적인 숫자로 먼저 확인하기' : "기재된 비용·시간('" + opt.costOrTime.trim() + "') 외 추가 부대 조건이 없는지 확인하기",
              '실제 경험자 후기나 환불·취소·변경 조건을 최종 결정 전 한 번 더 검토하기'
            ],
            confirmedFacts: confirmedFacts,
            aiAssumptions: aiAssumptions
          };

          return {
            optionId: opt.id,
            optionName: opt.name.trim(),
            pros: pros,
            cons: cons.slice(0, 3),
            priorityFit: priorityFit,
            expectedOutcome: expectedOutcome,
            criterionScores: criterionScores,
            weightedScore: stats.weightedScore,
            scoredCriteriaCount: stats.scoredCriteriaCount,
            totalCriteriaCount: stats.totalCriteriaCount,
            futureSimulation: futureSimulation
          };
        });

        var sortedOptions = optionsAnalysis.slice().sort(function (a, b) {
          var sa = a.weightedScore !== null ? a.weightedScore : -1;
          var sb = b.weightedScore !== null ? b.weightedScore : -1;
          if (sb !== sa) return sb - sa;
          return b.scoredCriteriaCount - a.scoredCriteriaCount;
        });

        var bestOption = sortedOptions[0];
        var nonRecommended = optionsAnalysis
          .filter(function (o) { return o.optionId !== bestOption.optionId; })
          .map(function (o) {
            return {
              optionId: o.optionId,
              optionName: o.optionName,
              strength: o.pros[0] + (o.pros[1] ? ' · ' + o.pros[1] : '') + ' 측면에서는 여전히 매력적인 대안입니다.'
            };
          });

        var hasAnyInsufficient = optionsAnalysis.some(function (o) {
          return o.criterionScores.some(function (cs) { return cs.insufficientInfo; });
        });

        var infoToVerify = [];
        optionsAnalysis.forEach(function (o) {
          var missingCols = o.criterionScores
            .filter(function (cs) { return cs.insufficientInfo; })
            .map(function (cs) { return cs.criterionName; });
          if (missingCols.length > 0) {
            infoToVerify.push("'" + o.optionName + "'의 " + missingCols.join(', ') + ' 관련 구체적 수치나 조건 확인');
          }
        });
        if (dilemma.constraints.trim()) {
          infoToVerify.push("제약 조건('" + dilemma.constraints.trim().slice(0, 40) + (dilemma.constraints.trim().length > 40 ? '...' : '') + "')과의 실제 부합 여부 재확인");
        } else {
          infoToVerify.push('예산 상한선 및 마감 기한 등 개인적 제약 조건이 더 없는지 점검');
        }
        infoToVerify.push('선택 후 변경·취소·보완이 가능한지 여부 확인');

        var situationAnalysis =
          "'" + dilemma.title.trim() + "' 고민은 현재 상황에서 '" + topPriorityNames + "' 기준을 특히 중요하게 고려하면서 " +
          dilemma.options.length + '가지 대안의 균형을 맞추려는 의사결정입니다. ' +
          (dilemma.constraints.trim() ? '제시하신 제약 조건을 함께 반영했으며, ' : '') +
          (clarifText ? '추가로 답해주신 배경 정보까지 종합해 각 선택지의 적합도를 비교했습니다.' : '입력하신 특징과 비용·시간 정보를 바탕으로 객관적인 비교 포인트를 정리했습니다.');

        var recommendationReason =
          "사용자께서 높은 비중을 두신 '" + topPriorityNames + "' 기준을 가중 평균으로 반영했을 때, '" + bestOption.optionName +
          "'이(가) 전반적인 균형 점수가 가장 높게 나타났습니다. 특히 " +
          (bestOption.pros[0] ? "'" + bestOption.pros[0] + "' 점이 " : '') +
          '현재 고민의 목적과 잘 맞물립니다. 다만 다른 선택지들도 각기 분명한 장점을 지니고 있으므로, 아래 비교표와 미래 시뮬레이션을 함께 보신 뒤 최종 결정을 내려보세요.';

        var regretCheckQuestions = [
          {
            id: 'q1',
            question: "이번 '" + dilemma.title.trim() + "' 결정에서 끝까지 양보하기 어려운 핵심 가치는 무엇인가요?",
            placeholder: '예: 당장의 비용 절감보다 앞으로 2~3년간 편하게 쓰는 것'
          },
          {
            id: 'q2',
            question: "'" + bestOption.optionName + "' 또는 염두에 둔 선택을 골랐을 때 가장 아쉬울 것 같은 점은 무엇인가요?",
            placeholder: '예: 다른 선택지가 주는 비용 절감이나 새로운 경험 기회를 놓치는 점'
          },
          {
            id: 'q3',
            question: '결정을 확정하기 전에 직접 확인하거나 주변에 물어봐야 할 사항이 남아 있나요?',
            placeholder: '예: 실제 사용 조건, 환불 규정, 혹은 마감 일정 확인'
          },
          {
            id: 'q4',
            question: '선택하지 않은 대안들을 지금 내려놓더라도 마음이 편안할까요?',
            placeholder: '예: 지금 상황에서 내릴 수 있는 최선이라면 납득할 수 있음'
          }
        ];

        return {
          analyzedAt: new Date().toISOString(),
          situationAnalysis: situationAnalysis,
          recommendedOptionId: bestOption.optionId,
          recommendedOptionName: bestOption.optionName,
          recommendationReason: recommendationReason,
          nonRecommendedStrengths: nonRecommended,
          infoToVerify: infoToVerify,
          missingInfoNotice: hasAnyInsufficient
            ? "일부 기준은 입력된 정보가 충분하지 않아 임의로 점수를 추측하지 않고 ‘정보 부족’으로 표기했습니다."
            : null,
          sensitiveDomainNotice: detectSensitiveDomain(dilemma.title, dilemma.situation, dilemma.constraints),
          optionsAnalysis: optionsAnalysis,
          regretCheckQuestions: regretCheckQuestions
        };
      }

      function generateRegretFeedback(title, selectedOptionName, answers) {
        var filled = answers.filter(function (a) { return a.answer && a.answer.trim(); });
        var combined = filled.map(function (a) { return a.answer; }).join(' ');

        var checklist = [
          "선택하신 '" + selectedOptionName + "'이(가) 말씀하신 핵심 기준과 어긋나지 않는지 한 번 더 대조해 보세요."
        ];
        var tips = [];

        if (/비용|돈|가격|예산|비싸/.test(combined)) {
          checklist.push('예상 범위 외에 숨은 추가 지출이나 유지 비용이 없는지 최종 견적을 확인하세요.');
          tips.push('예산 상한선을 명확히 정해두고, 그 범위 안에서만 진행하면 지출에 대한 후회를 크게 줄일 수 있습니다.');
        }
        if (/시간|바쁘|일정|피곤|체력/.test(combined)) {
          checklist.push('실제 주간 일정표에 이 선택을 넣었을 때 수면이나 휴식 시간이 지나치게 줄지 않는지 확인하세요.');
          tips.push('처음 2주간은 무리하지 않는 시범 기간으로 두고, 부담이 크면 빈도를 조절할 여지를 남겨두세요.');
        }
        if (/아쉽|포기|미련|고민|걱정|불안/.test(combined)) {
          checklist.push('포기하는 선택지의 장점 중 일부를 보완할 작은 대안(예: 추후 재시도 일정 잡기)이 있는지 적어보세요.');
          tips.push('이번 결정이 평생 되돌릴 수 없는 선택이 아니라는 점을 기억하면 불필요한 미련을 덜 수 있습니다.');
        }
        if (/확인|물어|규정|후기|비교/.test(combined)) {
          checklist.push('답변에 적으신 확인 사항(규정, 후기, 실물 확인 등)을 오늘 안에 체크리스트로 완료한 뒤 확정하세요.');
        }

        if (checklist.length < 3) {
          checklist.push('결정을 실행에 옮기기 전, 가장 중요한 1가지 조건만 충족된다면 바로 시작할 수 있는 상태인지 점검하세요.');
        }
        if (tips.length < 2) {
          tips.push('선택한 뒤에는 고르지 않은 대안과 계속 비교하기보다, 선택한 길에서 기대한 장점을 최대화하는 데 집중해 보세요.');
          tips.push('일정 기간이 지난 뒤 이 앱의 ‘결정 기록’에 실제 만족도와 소감을 남기면 다음 선택이 훨씬 수월해집니다.');
        }

        return {
          adviceSummary: "'" + title + "' 고민에 대해 직접 정리해주신 " + filled.length + '개의 답변을 살펴보면, 현재 가장 신경 쓰시는 부분과 망설임의 이유가 비교적 뚜렷하게 드러납니다. 아래 점검 항목만 확인하시면 한결 가벼운 마음으로 선택을 확정하실 수 있습니다.',
          finalChecklist: checklist.slice(0, 4),
          regretMitigationTips: tips.slice(0, 3),
          readinessNote: "'" + selectedOptionName + "'을(를) 포함해 최종 선택의 권한은 온전히 당신에게 있습니다. 충분히 고민하신 만큼 어떤 결정을 내리시더라도 스스로의 기준을 믿고 한 걸음 나아가 보세요."
        };
      }

      /* =========================================================
       * 5. Application State
       * ========================================================= */
      var state = {
        view: 'home', // home | input | priorities | clarify | analyzing | results | history
        dilemma: createEmptyDilemma(),
        priorities: clone(DEFAULT_PRIORITIES),
        inputErrors: null,
        inputSummaryErrors: [],
        priorityAddError: null,
        newCriterionName: '',
        newCriterionWeight: 3,
        clarifyingQuestions: [],
        analysisResult: null,
        simActiveOptionId: '',
        regretAnswers: {},
        regretError: null,
        regretFeedback: null,
        selectedFinalOptionId: '',
        confirmedOptionName: null,
        currentRecordId: null,
        records: loadRecords(),
        historySearch: '',
        editingRecordId: null,
        editFinalDecision: '',
        editSatisfaction: null,
        editReview: '',
        confirmDeleteId: null
      };

      // Support ?autostart=1
      try {
        var params = new URLSearchParams(window.location.search);
        if (params.get('autostart') === '1') {
          state.view = 'input';
        }
      } catch (e) {}

      function scrollTop() {
        try {
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } catch (e) {
          window.scrollTo(0, 0);
        }
      }

      function navigate(nextView) {
        state.view = nextView;
        render();
        scrollTop();
      }

      function startNew() {
        state.dilemma = createEmptyDilemma();
        state.priorities = clone(DEFAULT_PRIORITIES);
        state.inputErrors = null;
        state.inputSummaryErrors = [];
        state.clarifyingQuestions = [];
        state.analysisResult = null;
        state.regretAnswers = {};
        state.regretFeedback = null;
        state.regretError = null;
        state.confirmedOptionName = null;
        state.currentRecordId = null;
        navigate('input');
      }

      function loadPreset(presetId) {
        var preset = DILEMMA_PRESETS.find(function (p) { return p.id === presetId; });
        if (!preset) return;
        state.dilemma = clone(preset.dilemma);
        state.priorities = clone(preset.priorities);
        state.inputErrors = null;
        state.inputSummaryErrors = [];
        state.analysisResult = null;
        state.regretAnswers = {};
        state.regretFeedback = null;
        state.confirmedOptionName = null;
        state.currentRecordId = null;
        navigate('input');
      }

      function runFullAnalysis(clarifications) {
        state.view = 'analyzing';
        render();
        scrollTop();

        window.setTimeout(function () {
          var res = analyzeDecision(state.dilemma, state.priorities, clarifications || []);
          state.analysisResult = res;
          state.simActiveOptionId = res.recommendedOptionId;
          state.selectedFinalOptionId = res.recommendedOptionId;
          state.regretAnswers = {};
          state.regretFeedback = null;
          state.regretError = null;
          state.confirmedOptionName = null;
          state.currentRecordId = null;
          state.view = 'results';
          render();
          scrollTop();
        }, 450);
      }

      function startAnalysisFlow() {
        var check = validateDilemmaInput(state.dilemma);
        if (!check.isValid) {
          state.inputErrors = check.errors;
          state.inputSummaryErrors = check.summaryMessages;
          navigate('input');
          return;
        }
        var questions = buildClarifyingQuestions(state.dilemma, state.priorities);
        if (questions.length > 0) {
          state.clarifyingQuestions = questions.map(function (q) {
            return { question: q, answer: '' };
          });
          navigate('clarify');
          return;
        }
        runFullAnalysis([]);
      }

      function upsertCurrentRecord(finalDecisionName) {
        if (!state.analysisResult) return;
        var now = new Date().toISOString();
        var recordId = state.currentRecordId || ('rec-' + Date.now());
        var existing = state.records.find(function (r) { return r.id === recordId; });
        var record = {
          id: recordId,
          title: state.dilemma.title.trim(),
          createdAt: existing ? existing.createdAt : now,
          updatedAt: now,
          options: state.dilemma.options.map(function (o) { return o.name.trim(); }),
          recommendedOption: state.analysisResult.recommendedOptionName,
          recommendationReason: state.analysisResult.recommendationReason,
          finalDecision: finalDecisionName,
          satisfaction: existing ? existing.satisfaction : null,
          review: existing ? existing.review : ''
        };
        state.records = [record].concat(state.records.filter(function (r) { return r.id !== recordId; }));
        persistRecords(state.records);
        state.currentRecordId = recordId;
      }

      /* =========================================================
       * 6. Rendering Views
       * ========================================================= */
      function renderHeader() {
        var navItems = [
          { id: 'home', label: '홈' },

        var desktopLinks = navItems.map(function (item) {

          return '<button type="button" class="' + cls + '" data-nav="' + item.id + '">' + escapeHtml(item.label) + '</button>';
        }).join('');

        var mobileLinks = navItems.map(function (item) {

          '</div>' +
          '<nav class="mobile-nav" aria-label="모바일 메뉴">' + mobileLinks + '</nav>';
      }

        }).join('');

        var countText = state.records.length > 0
          ? ' <span class="mono" style="font-size:12px;color:#5A6578;">(' + state.records.length + ')</span>'
          : '';

        return '<div class="container page-section stack-lg">' +

            '<div style="display:flex;flex-direction:column;justify-content:center;gap:24px;">' +

                '<p class="lead" style="margin-top:8px;">일상의 크고 작은 갈림길 앞에서 혼자 고민하지 마세요. 결정나침반은 당신의 상황과 중요하게 여기는 우선순위를 함께 분석해, 선택지별 장단점과 예상 결과까지 균형 있게 정리해 드립니다.</p>' +
              '</div>' +
              '<div class="flex-row">' +
                '<button type="button" class="btn btn-primary" data-action="start-new">' +
                  '<span>새로운 고민 시작하기</span>' + ICONS.arrowRight +
                '</button>' +
                '<button type="button" class="btn btn-secondary" data-nav="history">' +
                  ICONS.history + '<span>이전 결정 기록 보기</span>' + countText +
                '</button>' +
              '</div>' +
              '<div class="divider-top flex-row" style="font-size:14px;color:#4B5568;gap:8px 14px;">' +
                '<span style="white-space:nowrap;">예시 고민으로 바로 체험:</span>' +
                '<span class="flex-row" style="gap:14px;">' + presetLinks + '</span>' +
              '</div>' +
            '</div>' +
            '<div class="hero-visual">' + heroIllustrationSvg() + '</div>' +
          '</section>' +

          '<section aria-labelledby="features-heading" class="stack-sm">' +
            '<div class="stack-xs">' +
              '<h2 id="features-heading" class="h2-section">스스로 확신 있는 결정을 내리는 3단계 흐름</h2>' +
              '<p class="muted">단순히 하나의 답을 강요하지 않고, 근거 있는 비교와 성찰 과정을 제공합니다.</p>' +
            '</div>' +
            '<div class="grid-3">' +
              '<article class="card" style="display:flex;flex-direction:column;justify-content:space-between;gap:20px;">' +
                '<div class="stack-xs">' +
                  '<div class="feature-icon-box">' + ICONS.scale + '</div>' +
                  '<h3 class="h3-card" style="margin-top:12px;">01. 우선순위 맞춤 가중 분석</h3>' +

            '</div>' +

              '<textarea id="opt-features-' + escapeHtml(opt.id) + '" rows="2" class="textarea' + (optErr.features ? ' error' : '') + '" data-opt-field="features" data-opt-id="' + escapeHtml(opt.id) + '" placeholder="이 선택지를 골랐을 때 기대되는 특징, 장점, 매력 포인트를 적어주세요.">' + escapeHtml(opt.features) + '</textarea>' +

        return '<div class="container-narrow page-section stack-md">' +

              '<strong style="color:var(--navy-900);">1. 고민 및 선택지 입력</strong>' +
              '<span aria-hidden="true">→</span><span>2. 개인 우선순위 설정</span>' +

          '<div class="card-lavender flex-between" style="padding:18px 20px;">' +
            '<div class="flex-row" style="font-size:14px;color:var(--navy-900);gap:8px;">' +
              ICONS.sparkles + '<span>입력이 막막하다면 예시 데이터를 불러와 바로 테스트해 보세요.</span>' +

            '<div class="flex-row" style="gap:8px;">' + presetBtns + '</div>' +

          errorSummaryHtml +

          '<form id="dilemma-form" class="stack-md" novalidate>' +
            '<div class="card stack-sm">' +
              '<div>' +
                '<label class="field-label" for="dilemma-title">1. 고민의 제목 <span class="required-mark">*</span></label>' +
                '<input id="dilemma-title" type="text" class="input' + (errs && errs.title ? ' error' : '') + '" data-dilemma-field="title" value="' + escapeHtml(state.dilemma.title) + '" placeholder="예: 재택 및 카페 작업용 노트북 교체 고민" />' +

              '</div>' +
              '<div>' +
                '<label class="field-label" for="dilemma-situation">2. 고민이 발생한 상황과 이유 <span class="required-mark">*</span></label>' +

            '<div class="stack-sm">' +
              '<div class="flex-between">' +
                '<div>' +
                  '<h2 class="h2-section" style="font-size:18px;">3. 비교할 선택지 (<span class="tabular-nums">' + state.dilemma.options.length + ' / 5</span>개)</h2>' +
                  '<p class="muted" style="font-size:13px;margin-top:2px;">최소 2개, 최대 5개의 선택지를 등록하고 각각의 특징과 비용·시간을 적어주세요.</p>' +
                '</div>' +

              '</div>' +
              (errs && errs.optionsGeneral ? '<p class="error-text">' + escapeHtml(errs.optionsGeneral) + '</p>' : '') +

            '<div class="card">' +

              '<p class="muted" style="font-size:13px;margin-bottom:8px;">예산 상한선, 마감 기한, 피하고 싶은 조건 등 꼭 반영해야 할 조건이 있다면 적어주세요.</p>' +
              '<textarea id="dilemma-constraints" rows="3" class="textarea" data-dilemma-field="constraints" placeholder="예: 월 지출 20만 원 이하로 제한하고 싶고, 평일 밤 10시 이후에는 시간이 어렵습니다.">' + escapeHtml(state.dilemma.constraints) + '</textarea>' +
            '</div>' +

            '<div style="display:flex;justify-content:flex-end;">' +
              '<button type="submit" class="btn btn-primary">' +

              '</button>' +
            '</div>' +
          '</form>' +
        '</div>';

      function renderPrioritiesView() {
        var WEIGHT_LABELS = { 1: '거의 중요하지 않음', 2: '조금 중요함', 3: '보통', 4: '중요함', 5: '매우 중요함' };
        var shares = calculateWeightShares(state.priorities);
        var canDelete = state.priorities.length > 1;

        var rowsHtml = shares.map(function (c) {
          return '<div class="priority-row">' +
            '<div style="min-width:210px;">' +
              '<label for="slider-' + escapeHtml(c.id) + '" style="font-weight:700;color:var(--navy-900);display:block;">' + escapeHtml(c.name) + '</label>' +
              '<p class="muted tabular-nums" style="font-size:12px;margin-top:2px;" data-share-for="' + escapeHtml(c.id) + '">반영 비중 ' + c.sharePercent + '% · ' + WEIGHT_LABELS[c.weight] + '</p>' +
            '</div>' +
            '<div class="flex-row" style="flex:1;flex-wrap:nowrap;gap:14px;">' +
              '<input id="slider-' + escapeHtml(c.id) + '" type="range" min="1" max="5" step="1" value="' + c.weight + '" class="compass-slider" data-priority-slider="' + escapeHtml(c.id) + '" aria-label="' + escapeHtml(c.name) + ' 중요도" />' +

              '<button type="button" class="btn btn-danger-ghost" style="min-width:36px;padding:6px;" data-delete-priority="' + escapeHtml(c.id) + '" ' + (canDelete ? '' : 'disabled') + ' aria-label="' + escapeHtml(c.name) + ' 기준 삭제">' + ICONS.trash + '</button>' +
            '</div>' +
          '</div>';
        }).join('');

        return '<div class="container-narrow page-section stack-md">' +
          '<div class="stack-sm">' +
            '<div class="flex-row" style="font-size:13px;color:var(--text-muted);gap:8px;">' +
              '<button type="button" class="text-link" style="font-size:13px;" data-nav="input">1. 고민 및 선택지 입력</button>' +
              '<span aria-hidden="true">→</span><strong style="color:var(--navy-900);">2. 개인 우선순위 설정</strong>' +
              '<span aria-hidden="true">→</span><span>3. 분석 결과</span>' +
            '</div>' +
            '<div class="flex-between">' +
              '<div>' +
                '<h1 class="h1-page">나에게 가장 중요한 기준을 정해 주세요</h1>' +
                '<p class="muted" style="margin-top:4px;">중요도가 높은 기준일수록 최종 비교 점수의 가중 평균에 더 큰 비중으로 반영됩니다.</p>' +
              '</div>' +
              '<button type="button" class="btn btn-secondary btn-sm" data-action="reset-priorities">' + ICONS.reset + '<span>기본 기준으로 복원</span></button>' +
            '</div>' +
          '</div>' +

          '<div class="card stack-sm">' +
            '<div class="flex-between divider-bottom">' +
              '<h2 class="h3-card">선택 기준 중요도 (<span class="tabular-nums">' + state.priorities.length + '</span>개)</h2>' +
              '<span class="muted tabular-nums" style="font-size:12px;">1점(낮음) ~ 5점(매우 중요)</span>' +
            '</div>' +
            '<div>' + rowsHtml + '</div>' +
          '</div>' +

          '<form id="add-priority-form" class="card-lavender stack-sm">' +
            '<div>' +
              '<h2 class="h3-card" style="font-size:16px;">나만의 기준 직접 추가하기</h2>' +
              '<p class="muted" style="font-size:13px;margin-top:2px;">예: 건강, 가족과의 시간, 성장 가능성, 이동 거리, 디자인 등</p>' +

              '<button type="submit" class="btn btn-lavender">' + ICONS.plus + '<span>기준 추가</span></button>' +

          '<div class="flex-between">' +
            '<button type="button" class="btn btn-secondary" data-nav="input">' + ICONS.arrowLeft + '<span>이전 단계로</span></button>' +
            '<button type="button" class="btn btn-primary" data-action="start-analysis">' + ICONS.sparkles + '<span>분석 시작하기</span></button>' +
          '</div>' +
        '</div>';

          '</div>' +
        '</div>';

          '<div style="width:76px;height:76px;border-radius:18px;background:var(--lavender-100);border:1px solid var(--lavender-200);display:inline-flex;align-items:center;justify-content:center;margin-bottom:20px;">' +
            compassSvg('animate-compass') +
          '</div>' +
          '<h2 class="h2-section">우선순위 가중치를 반영해 선택지를 분석하고 있습니다...</h2>' +
          '<p class="muted" style="margin-top:8px;">선택지별 장단점, 비교 점수, 미래 시뮬레이션과 후회 방지 질문을 정리하는 중입니다.</p>' +
        '</div>';

      function renderResultsView() {
        var r = state.analysisResult;
        var d = state.dilemma;
        var shares = calculateWeightShares(state.priorities);
        var recOpt = r.optionsAnalysis.find(function (o) { return o.optionId === r.recommendedOptionId; }) || r.optionsAnalysis[0];
        var simOpt = r.optionsAnalysis.find(function (o) { return o.optionId === state.simActiveOptionId; }) || r.optionsAnalysis[0];
        var candidateOpt = r.optionsAnalysis.find(function (o) { return o.optionId === state.selectedFinalOptionId; }) || recOpt;

        var noticesHtml =
          '<div class="alert-box alert-info">' +
            ICONS.info +
            '<p style="margin:0;">표시된 점수와 분석은 입력하신 정보를 바탕으로 산출한 <strong style="color:var(--navy-900);">참고용 추정치</strong>입니다. 최종 선택의 주도권은 항상 사용자에게 있으며, 추천되지 않은 선택지 역시 상황에 따라 충분히 좋은 대안이 될 수 있습니다.</p>' +
          '</div>';

        if (r.missingInfoNotice) {
          noticesHtml += '<div class="alert-box alert-lavender">' + ICONS.alert + '<p style="margin:0;">' + escapeHtml(r.missingInfoNotice) + '</p></div>';
        }
        if (r.sensitiveDomainNotice) {
          noticesHtml += '<div role="note" class="alert-box alert-warn">' + ICONS.alert + '<p style="margin:0;">' + escapeHtml(r.sensitiveDomainNotice) + '</p></div>';

        // Section 2 right column
        var otherStrengthsHtml = '';

          otherStrengthsHtml = '<div class="card-lavender stack-xs">' +

            '</ul>' +
          '</div>';

        // Section 3 table
        var tableHeaders = r.optionsAnalysis.map(function (opt) {
          var badge = opt.optionId === r.recommendedOptionId

        var costRowCells = d.options.map(function (io) {
          return '<td>' + escapeHtml(io.costOrTime.trim() || '정보 부족') + '</td>';

        var criteriaRows = shares.map(function (p) {
          var cells = r.optionsAnalysis.map(function (opt) {
            var cs = opt.criterionScores.find(function (c) { return c.criterionId === p.id || c.criterionName === p.name; });
            var missing = !cs || cs.insufficientInfo || cs.score === null;
            if (missing) {
              return '<td><span style="font-size:12px;color:#6B7280;font-weight:500;">정보 부족</span></td>';

            return '<td><span class="mono" style="font-weight:700;color:var(--navy-900);">' + cs.score + ' / 5</span>' +
              '<p style="margin:4px 0 0;font-size:12px;color:var(--text-muted);">' + escapeHtml(cs.rationale) + '</p></td>';
          }).join('');
          return '<tr><td><strong style="color:var(--navy-900);">' + escapeHtml(p.name) + '</strong><span class="tabular-nums" style="display:block;font-size:12px;color:var(--text-muted);">중요도 ' + p.weight + '/5 · 비중 ' + p.sharePercent + '%</span></td>' + cells + '</tr>';
        }).join('');

        var totalRowCells = r.optionsAnalysis.map(function (opt) {
          return '<td class="mono" style="font-size:15px;">' + (opt.weightedScore !== null ? opt.weightedScore.toFixed(2) + ' / 5.00' : '정보 부족') + '</td>';
        }).join('');

        // Section 4 priority score bars
        var priorityCards = shares.map(function (p) {
          var bars = r.optionsAnalysis.map(function (opt) {
            var cs = opt.criterionScores.find(function (c) { return c.criterionId === p.id || c.criterionName === p.name; });
            var missing = !cs || cs.insufficientInfo || cs.score === null;
            var pct = missing ? 0 : (cs.score / 5) * 100;
            var fillColor = opt.optionId === r.recommendedOptionId ? '#14213D' : '#9483C6';
            return '<div style="margin-bottom:10px;">' +
              '<div class="flex-between" style="font-size:13px;margin-bottom:4px;">' +
                '<span style="font-weight:500;color:var(--navy-900);">' + escapeHtml(opt.optionName) + '</span>' +
                '<span class="mono" style="font-weight:600;color:var(--navy-900);">' + (missing ? '정보 부족' : cs.score + '점') + '</span>' +

              '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%;background:' + fillColor + ';"></div></div>' +
            '</div>';

          return '<div class="card stack-sm" style="padding:22px;">' +
            '<div class="flex-between divider-bottom">' +
              '<h3 class="h3-card" style="font-size:16px;">' + escapeHtml(p.name) + '</h3>' +

          '</div>';

                '<h3 class="h3-card">' + escapeHtml(opt.optionName) + '</h3>' +
                (isRec ? '<p style="margin:2px 0 0;font-size:12px;font-weight:600;color:var(--navy-700);">우선순위 기준 추천 선택지</p>' : '') +
              '</div>' +
              '<span class="mono" style="font-size:14px;font-weight:700;color:var(--navy-900);">' + (opt.weightedScore !== null ? opt.weightedScore.toFixed(2) + '점' : '정보 부족') + '</span>' +
            '</div>' +
            '<div class="grid-2" style="font-size:14px;">' +
              '<div>' +
                '<h4 style="margin:0 0 6px;font-size:12px;color:var(--success);">장점</h4>' +
                '<ul style="margin:0;padding-left:18px;color:var(--text-secondary);">' +
                  opt.pros.map(function (pro) { return '<li style="margin-bottom:4px;">' + escapeHtml(pro) + '</li>'; }).join('') +
                '</ul>' +
              '</div>' +
              '<div>' +
                '<h4 style="margin:0 0 6px;font-size:12px;color:#991B1B;">단점 및 유의점</h4>' +
                '<ul style="margin:0;padding-left:18px;color:var(--text-secondary);">' +
                  opt.cons.map(function (con) { return '<li style="margin-bottom:4px;">' + escapeHtml(con) + '</li>'; }).join('') +
                '</ul>' +
              '</div>' +
            '</div>' +
            '<div class="divider-top stack-xs" style="font-size:14px;">' +
              '<div><span style="font-size:12px;font-weight:600;color:var(--text-muted);display:block;">우선순위 적합성</span><p style="margin:2px 0 0;">' + escapeHtml(opt.priorityFit) + '</p></div>' +
              '<div><span style="font-size:12px;font-weight:600;color:var(--text-muted);display:block;">예상되는 결과</span><p style="margin:2px 0 0;color:var(--text-secondary);">' + escapeHtml(opt.expectedOutcome) + '</p></div>' +
            '</div>' +
          '</article>';
        }).join('');

        // Section 6 Future simulation tabs
        var simTabs = r.optionsAnalysis.map(function (opt) {
          var active = opt.optionId === simOpt.optionId;
          return '<button type="button" role="tab" aria-selected="' + active + '" class="tab-btn' + (active ? ' active' : '') + '" data-sim-tab="' + escapeHtml(opt.optionId) + '">' + escapeHtml(opt.optionName) + '</button>';
        }).join('');

        // Section 7 Regret check questions
        var regretQHtml = r.regretCheckQuestions.map(function (q, idx) {

          '</div>';
        }).join('');

        var regretFeedbackHtml = '';
        if (state.regretFeedback) {
          var fb = state.regretFeedback;
          regretFeedbackHtml = '<div class="card-lavender stack-sm" style="border-color:var(--lavender-200);">' +
            '<div>' +
              '<h3 class="h3-card">후회 방지 점검 결과</h3>' +
              '<p style="margin:6px 0 0;color:var(--text-secondary);">' + escapeHtml(fb.adviceSummary) + '</p>' +
            '</div>' +
            '<div class="grid-2 divider-top" style="font-size:14px;">' +
              '<div><h4 style="margin:0 0 8px;font-size:14px;color:var(--navy-900);">최종 점검 사항</h4><ul style="margin:0;padding-left:18px;color:var(--text-secondary);">' +
                fb.finalChecklist.map(function (it) { return '<li style="margin-bottom:6px;">' + escapeHtml(it) + '</li>'; }).join('') +
              '</ul></div>' +
              '<div><h4 style="margin:0 0 8px;font-size:14px;color:var(--navy-900);">후회를 줄이기 위한 조언</h4><ul style="margin:0;padding-left:18px;color:var(--text-secondary);">' +
                fb.regretMitigationTips.map(function (it) { return '<li style="margin-bottom:6px;">' + escapeHtml(it) + '</li>'; }).join('') +
              '</ul></div>' +
            '</div>' +
            '<p class="divider-top" style="margin:0;font-size:14px;font-weight:600;color:var(--navy-700);">' + escapeHtml(fb.readinessNote) + '</p>' +
          '</div>';

            '<button type="button" class="text-link" style="color:var(--success);font-size:13px;" data-nav="history">결정 기록에서 보기 →</button>' +

              '<span>' + escapeHtml(d.title) + '</span><span aria-hidden="true">·</span>' +
              '<span class="tabular-nums">선택지 ' + r.optionsAnalysis.length + '개</span><span aria-hidden="true">·</span>' +
              '<span>참고용 추정치</span>' +
            '</div>' +
            noticesHtml +
          '</div>' +

          '<!-- 1. 가장 추천하는 선택지 -->' +
          '<section aria-labelledby="sec-recommended">' +
            '<div class="card-navy stack-sm">' +
              '<div class="flex-between" style="border-bottom:1px solid rgba(255,255,255,0.16);padding-bottom:20px;">' +
                '<div class="stack-xs">' +
                  '<p class="flex-row" style="gap:6px;margin:0;font-size:13px;color:var(--lavender-200);">' + compassSvg() + '<span>1. 우선순위 가중치 기준 가장 적합한 선택지</span></p>' +

                  '<p class="mono" style="margin:4px 0 0;font-size:24px;font-weight:700;">' + (recOpt.weightedScore !== null ? recOpt.weightedScore.toFixed(2) + ' / 5.00' : '정보 부족') + '</p>' +
                '</div>' +
              '</div>' +
              '<p style="margin:0;color:var(--lavender-100);line-height:1.65;">' + escapeHtml(recOpt.priorityFit || recOpt.expectedOutcome) + '</p>' +
            '</div>' +
          '</section>' +

          '<!-- 2. 추천 이유 -->' +
          '<section aria-labelledby="sec-reason" class="stack-sm">' +
            '<h2 id="sec-reason" class="h2-section">2. 상황 분석 및 추천 이유</h2>' +
            '<div class="grid-reason">' +
              '<div class="card stack-sm">' +
                '<div><h3 class="h3-card" style="font-size:16px;">전체 고민 상황 분석</h3><p style="margin:8px 0 0;color:var(--text-secondary);line-height:1.65;">' + escapeHtml(r.situationAnalysis) + '</p></div>' +
                '<div class="divider-top"><h3 class="h3-card" style="font-size:16px;">‘' + escapeHtml(recOpt.optionName) + '’을(를) 추천하는 이유</h3><p style="margin:8px 0 0;color:var(--text-secondary);line-height:1.65;">' + escapeHtml(r.recommendationReason) + '</p></div>' +
              '</div>' +
              '<div class="stack-sm">' +
                otherStrengthsHtml +
                '<div class="card stack-xs">' +
                  '<h3 class="h3-card" style="font-size:16px;">결정 전 추가로 확인하면 좋은 정보</h3>' +
                  '<ul style="margin:8px 0 0;padding-left:18px;font-size:14px;color:var(--text-secondary);">' +
                    r.infoToVerify.map(function (info) { return '<li style="margin-bottom:6px;">' + escapeHtml(info) + '</li>'; }).join('') +
                  '</ul>' +
                '</div>' +
              '</div>' +
            '</div>' +
          '</section>' +

          '<section aria-labelledby="sec-table" class="stack-sm">' +
            '<div>' +
              '<h2 id="sec-table" class="h2-section">3. 선택지별 종합 비교표</h2>' +
              '<p class="muted" style="margin-top:4px;">각 기준 점수는 1~5점 척도이며, 정보가 부족한 항목은 추정하지 않고 ‘정보 부족’으로 표시됩니다.</p>' +
            '</div>' +
            '<div class="table-wrap">' +
              '<table class="compare-table">' +
                '<thead><tr><th>비교 기준 (중요도)</th>' + tableHeaders + '</tr></thead>' +
                '<tbody>' +
                  '<tr><td><strong style="color:var(--navy-900);">예상 비용 / 시간</strong></td>' + costRowCells + '</tr>' +

                  '<tr><td>가중 평균 최종 점수</td>' + totalRowCells + '</tr>' +
                '</tbody>' +
              '</table>' +
            '</div>' +
          '</section>' +

          '<!-- 4. 우선순위별 점수 -->' +
          '<section aria-labelledby="sec-priority-scores" class="stack-sm">' +
            '<div>' +
              '<h2 id="sec-priority-scores" class="h2-section">4. 우선순위별 점수 비교</h2>' +
              '<p class="muted" style="margin-top:4px;">내가 중요하게 설정한 기준마다 각 선택지가 어떤 균형을 보이는지 한눈에 확인해 보세요.</p>' +
            '</div>' +
            '<div class="grid-2">' + priorityCards + '</div>' +
          '</section>' +

          '<!-- 5. 각 선택지의 장단점 -->' +
          '<section aria-labelledby="sec-pros-cons" class="stack-sm">' +
            '<h2 id="sec-pros-cons" class="h2-section">5. 각 선택지의 장단점 및 예상 결과</h2>' +
            '<div class="grid-2">' + prosConsCards + '</div>' +

          '<!-- 6. 미래의 나 시뮬레이션 -->' +

            '<div>' +
              '<h2 id="sec-future-sim" class="h2-section">6. 미래의 나 시뮬레이션</h2>' +
              '<p class="muted" style="margin-top:4px;">특정 선택을 했을 때 펼쳐질 수 있는 시나리오입니다. 미래를 확정적으로 예언하지 않으며, 입력된 사실과 추론을 구분해 보여드립니다.</p>' +
            '</div>' +
            '<div role="tablist" aria-label="시뮬레이션 대상 선택지" class="tablist">' + simTabs + '</div>' +
            '<div class="card stack-md">' +
              '<div class="flex-between divider-bottom">' +
                '<h3 class="h3-card">‘' + escapeHtml(simOpt.optionName) + '’ 선택 시 예상 시나리오</h3>' +
                '<span class="muted" style="font-size:12px;">가능성 탐색용 참고 시나리오 (확정 예측 아님)</span>' +
              '</div>' +
              '<div class="grid-2" style="font-size:14px;">' +
                '<div class="sim-block-ivory"><h4 style="margin:0 0 8px;color:var(--success);">예상되는 긍정적인 결과</h4><ul style="margin:0;padding-left:18px;color:var(--text-secondary);">' +

                  simOpt.futureSimulation.negativeOutcomes.map(function (x) { return '<li style="margin-bottom:6px;">' + escapeHtml(x) + '</li>'; }).join('') +
                '</ul></div>' +
                '<div class="sim-block-lavender"><h4 style="margin:0 0 8px;color:var(--navy-900);">장기적으로 고려해야 하는 사항</h4><ul style="margin:0;padding-left:18px;color:var(--text-secondary);">' +
                  simOpt.futureSimulation.longTermConsiderations.map(function (x) { return '<li style="margin-bottom:6px;">' + escapeHtml(x) + '</li>'; }).join('') +
                '</ul></div>' +
                '<div class="sim-block-lavender"><h4 style="margin:0 0 8px;color:var(--navy-900);">선택하기 전에 확인할 내용</h4><ul style="margin:0;padding-left:18px;color:var(--text-secondary);">' +
                  simOpt.futureSimulation.thingsToCheck.map(function (x) { return '<li style="margin-bottom:6px;">' + escapeHtml(x) + '</li>'; }).join('') +
